[project]
name = "fexlead"
version = "0.1.0"
description = "Compliance gate, scoring, and call-sheet export for final expense insurance leads"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1", "phonenumbers>=8.13", "email-validator>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
